[package]
name = "pzmod"
version = "0.1.0"
description = "Project Zomboid workshop mod manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
